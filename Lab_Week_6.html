<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

    <button id = "button1">Play1st</button>
    <button id = "button2">Play2nd</button>
    <button id = "button3">Play3rd</button>
    <button id = "button4">Play4th</button>

    <script>
       
       


        function playNote1(someContext, frequency1, dur1)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain1 = new GainNode(someContext1);
        
            
            osc1.frequency.value = frequency1;
            osc2.frequency.value = frequency1*2.1;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain1.gain.value = 0;

            osc1.connect(gain1).connect(someContext.destination);
            osc2.connect(gain1).connect(someContext.destination);

            let now = someContext.currentTime;

            gain1.gain.linearRampToValueAtTime(0.30, now + (dur1*0.01)); //attack
            gain1.gain.linearRampToValueAtTime(0.10, now + (dur1*0.01) + (dur1*0.08)) //decay
            gain1.gain.linearRampToValueAtTime(0.30, now + (dur1*0.01) + (dur1*0.08) + (dur1*0.9))
            gain1.gain.linearRampToValueAtTime(0, now + dur1); //release

            osc1.start();
            osc1.stop(now + dur1);

            osc2.start();
            osc2.stop(now + dur1);

        }
             const myCtx = new AudioContext();
        
             document.querySelector("#button1").onclick = () => playNote1(myCtx, 110, 1.0);

        
        
        function playNote2(someContext, frequency2, dur2)
        {
            const osc3 = new OscillatorNode(someContext);
            const osc4 = new OscillatorNode(someContext);
            const gain2 = new GainNode(someContext);
        
            
            osc3.frequency.value = frequency2;
            osc4.frequency.value = frequency2*2.01;
            osc3.type = "triangle"
            osc4.type = "triangle"
            gain2.gain.value = 0;

            osc3.connect(gain2).connect(someContext.destination);
            osc4.connect(gain2).connect(someContext.destination);

            let now = someContext.currentTime;

            gain2.gain.linearRampToValueAtTime(0.30, now + (dur2*0.01)); //attack
            gain2.gain.linearRampToValueAtTime(0.10, now + (dur2*0.01) + (dur2*0.08)) //decay
            gain2.gain.linearRampToValueAtTime(0.30, now + (dur2*0.01) + (dur2*0.08) + (dur2*0.9))
            gain2.gain.linearRampToValueAtTime(0, now + dur2); //release

            osc3.start();
            osc3.stop(now + dur2);

            osc4.start();
            osc4.stop(now + dur2);

        }

      
    document.querySelector("#button2").onclick = () => playNote2(myCtx, 165, 1.5);


    function playNote3(someContext, frequency3, dur3)
        {
            const osc5 = new OscillatorNode(someContext);
            const osc6 = new OscillatorNode(someContext);
            const gain3 = new GainNode(someContext);
        
            
            osc5.frequency.value = frequency3;
            osc6.frequency.value = frequency3*2.01;
            osc5.type = "triangle"
            osc6.type = "triangle"
            gain3.gain.value = 0;

            osc5.connect(gain2).connect(someContext.destination);
            osc6.connect(gain2).connect(someContext.destination);

            let now = someContext.currentTime;

            gain3.gain.linearRampToValueAtTime(0.30, now + (dur3*0.01)); //attack
            gain3.gain.linearRampToValueAtTime(0.10, now + (dur3*0.01) + (dur3*0.08)) //decay
            gain3.gain.linearRampToValueAtTime(0.30, now + (dur3*0.01) + (dur3*0.08) + (dur3*0.9))
            gain3.gain.linearRampToValueAtTime(0, now + dur3); //release

            osc5.start();
            osc5.stop(now + dur3);

            osc6.start();
            osc6.stop(now + dur3);

        }

      
    document.querySelector("#button3").onclick = () => playNote3(myCtx, 198, 1.5);

    </script>
    
</body>

</html>
